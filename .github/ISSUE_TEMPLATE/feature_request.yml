name: 功能建议
description: 描述想解决的问题和期待的使用方式
title: "[建议] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 现在遇到什么困难？在哪个环节需要改进？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 描述希望如何操作，以及预期结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 补充信息
      description: 可填写尝试过的替代方案或公开参考链接，请勿包含真实账号密钥。
